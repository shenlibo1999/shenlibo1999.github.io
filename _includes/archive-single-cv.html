{% include base_path %}

{% assign year = post.date | date: "%Y" %}

<li class="pub-item">
  <span class="pub-year">{{ year }}</span>
  <span class="pub-body">
    <span class="pub-authors">{{ post.authors }}</span>. 
    <span class="pub-title">{{ post.title }}</span>. 
    {% if post.venue %}<span class="pub-venue">{{ post.venue }}</span>{% endif %}
    {% if post.paperurl %}
      <a class="pub-link" href="{{ post.paperurl }}">[PDF]</a>
    {% endif %}
  </span>
</li>
